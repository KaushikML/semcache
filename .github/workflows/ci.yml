name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan, tsan]
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg-binary
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg-binary
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ matrix.preset }}
          restore-keys: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-

      - name: Restore model and ONNX Runtime cache
        uses: actions/cache@v4
        with:
          path: |
            models
            .cache/onnxruntime
          key: model-ort-${{ hashFiles('scripts/fetch-model.sh', 'cmake/onnxruntime.cmake') }}

      - name: Fetch model (pinned revision + SHA-256)
        run: scripts/fetch-model.sh

      - name: Bootstrap vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          scripts/bootstrap-vcpkg.sh

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --timeout 120
