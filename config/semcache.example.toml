# semcache configuration. Every key can be overridden by an env var:
#   SEMCACHE_<SECTION>__<KEY>   e.g. SEMCACHE_SERVER__PORT=9000, SEMCACHE_MODE=demo
# Secrets never live in this file:
#   SEMCACHE_UPSTREAM_API_KEY   key semcache uses to call upstream
#   tenants[].key_env           names the env var holding each tenant's client key
# Unknown keys are rejected at startup.

mode = "live"                      # "live" | "demo"

[server]
host = "0.0.0.0"
port = 8080
io_threads = 0                     # 0 = one per hardware thread
max_inflight = 1024                # chat requests in progress; beyond this => 503 + Retry-After
max_body_bytes = 1048576           # request body cap => 413
read_timeout_ms = 10000            # full request read; also keep-alive idle timeout
write_timeout_ms = 30000           # per write to the client
shutdown_timeout_ms = 5000         # drain budget on SIGTERM

[upstream]
base_url = "https://api.openai.com"
verify_tls = true
connect_timeout_ms = 3000          # DNS + TCP + TLS
first_byte_timeout_ms = 30000      # until response headers
idle_timeout_ms = 30000            # max gap between body reads (streams)
total_timeout_ms = 120000          # whole exchange
max_response_bytes = 8388608       # non-streaming bodies are buffered up to this

[embedder]
model_path = "models/all-MiniLM-L6-v2.onnx"   # scripts/fetch-model.sh; missing => passthrough only
vocab_path = "models/vocab.txt"
max_tokens = 256                   # longer prompts are never embedded (exact match only)
intra_op_threads = 1               # ORT threads per inference; parallelism comes from the embed pool
threads = 4                        # embed pool size (embedding + vector search run here, never on I/O threads)
queue_capacity = 1024              # pending embeds; when full, requests fail open (BYPASS)

[cache]
enabled = true
similarity_threshold = 0.90        # cosine; placeholder until Phase 7 measures the hit/false-hit curve
history_k = 2                      # prior non-system messages in the context key; -1 = all
max_temperature = 2.0              # requests above this are not cached
default_ttl_s = 86400
max_bytes = 1073741824             # global budget for entries (CLOCK eviction beyond it)
max_response_bytes = 65536         # larger responses are served but not stored
store_finish_reasons = ["stop", "tool_calls"]   # "length" (truncated) answers are never stored
restream_chunk_chars = 16          # re-streamed HIT chunk size
restream_delay_ms = 0              # pause between re-streamed chunks
sweep_interval_ms = 60000          # active TTL expiry
writer_queue_capacity = 4096       # pending inserts for the writer thread; full => insert dropped

[coalescer]
enabled = true                     # identical in-flight requests share one upstream call
max_waiters_per_flight = 1000      # beyond this, duplicates are served independently

[limits]
rps = 50                           # per-tenant token bucket
burst = 100

[logging]
level = "info"                     # trace|debug|info|warn|error
log_prompts = false                # prompt/response text is never logged unless true

[[tenants]]
id = "acme"
key_env = "SEMCACHE_KEY_ACME"
# max_bytes = 268435456            # optional cache quota (defaults to cache.max_bytes)
# ttl_s = 3600                     # optional entry TTL (defaults to cache.default_ttl_s)
